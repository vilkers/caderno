# O Pages deste repositório serve a branch gh-pages (foi assim que ele ligou
# sozinho: o token do Actions não tem permissão para criar o site pela API).
# Este workflow só espelha main em gh-pages a cada push — não há build.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Espelhar main em gh-pages
        run: git push --force origin HEAD:gh-pages
