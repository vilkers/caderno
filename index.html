<!doctype html>
<html lang="pt-BR" data-palette="noir" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caderno</title>
<meta name="description" content="Caderno — agenda pessoal de rotina, hábitos e afazeres.">
<meta name="theme-color" content="#0c0c0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="./assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/fonts/jetbrainsmono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ── Boot / splash ─────────────────────────────────────────── -->
<div id="boot" class="boot">
  <div class="boot__type"><span>C</span><span>A</span><span>D</span><span>E</span><span>R</span><span>N</span><span>O</span></div>
</div>

<!-- ── Tela de senha ─────────────────────────────────────────── -->
<section id="lock" class="lock" hidden>
  <div class="lock__grid" aria-hidden="true"></div>
  <div class="lock__inner">
    <p class="micro lock__eyebrow" data-scramble>ACESSO RESTRITO</p>
    <h1 class="display lock__title">CADERNO</h1>
    <p class="lock__sub" id="lockSub">Diário de rotina. Tudo fica cifrado neste aparelho.</p>

    <form id="lockForm" class="lock__form" autocomplete="off">
      <label class="field">
        <span class="micro">SENHA</span>
        <input id="lockPass" type="password" inputmode="text" autocomplete="current-password"
               placeholder="••••••••" required minlength="4" spellcheck="false">
      </label>
      <label class="field" id="lockConfirmField" hidden>
        <span class="micro">CONFIRME A SENHA</span>
        <input id="lockPass2" type="password" autocomplete="new-password" placeholder="••••••••" minlength="4" spellcheck="false">
      </label>
      <p class="lock__error micro" id="lockError" role="alert" aria-live="polite"></p>
      <button class="btn btn--big" id="lockBtn" type="submit"><span>ENTRAR</span></button>
    </form>

    <p class="lock__foot micro">
      <span id="lockHint"></span>
    </p>
  </div>
  <div class="ticker" aria-hidden="true"><div class="ticker__track" id="lockTicker"></div></div>
</section>

<!-- ── App ───────────────────────────────────────────────────── -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="ident" id="identBtn" title="Seu perfil">
      <span class="ident__av" id="identAv"></span>
      <span class="ident__txt">
        <span class="ident__n" id="identNome">Caderno</span>
        <span class="micro" id="topDate"></span>
      </span>
    </button>
    <div class="topbar__right">
      <button class="syncchip" id="syncBtn" hidden title="Sincronizar com o repositório">
        <span class="syncchip__dot"></span>
        <span class="syncchip__t micro"></span>
      </button>
      <button class="iconbtn" id="insightsBtn" title="Insights" aria-label="Insights"></button>
      <button class="iconbtn" id="menuBtn" title="Menu" aria-label="Menu"></button>
    </div>
  </header>

  <!-- embaixo mora a rotina: o que se toca todo dia -->
  <nav class="nav" id="nav" aria-label="Navegação principal">
    <button class="nav__item is-active" data-view="hoje" data-icon="hoje"><span class="nav__l">Hoje</span></button>
    <button class="nav__item" data-view="mes" data-icon="mes"><span class="nav__l">Mês</span></button>
    <button class="nav__item" data-view="lista" data-icon="lista"><span class="nav__l">Pessoal</span></button>
    <button class="nav__item" data-view="metas" data-icon="metas"><span class="nav__l">Metas</span></button>
  </nav>

  <main id="main" class="main" tabindex="-1"></main>

  <div class="toast" id="toast" aria-live="polite"></div>
</div>

<!-- ── Sheet (modal) genérico ────────────────────────────────── -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__head">
      <h2 class="sheet__title" id="sheetTitle"></h2>
      <button class="iconbtn" data-close aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<noscript><p style="padding:2rem;font-family:system-ui">O Caderno precisa de JavaScript para funcionar.</p></noscript>
<script type="module" src="./js/main.js"></script>
</body>
</html>
